<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-label="GITHUB STATS">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-stats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Neon Edge Gradient -->
    <linearGradient id="edge-grad-stats" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>  
      <stop offset="50%" stop-color="#f59e0b"/> 
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Background Grid -->
    <pattern id="grid-stats" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.06"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-stats" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="340" rx="14" fill="url(#bg-grad-stats)"/>
  <rect width="800" height="340" rx="14" fill="url(#grid-stats)"/>

  <!-- Outer Border -->
  <rect x="2" y="2" width="796" height="336" rx="12" fill="none" stroke="url(#edge-grad-stats)" stroke-width="1.5" opacity="0.75"/>

  <!-- Cyber Corner Brackets -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="square" opacity="0.9">
    <path d="M 12 28 V 12 H 28"/>
    <path d="M 772 28 V 12 H 788"/>
    <path d="M 12 312 V 328 H 28"/>
    <path d="M 772 312 V 328 H 788"/>
  </g>

  <!-- Status Bar Top -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="10" letter-spacing="2">
    <circle cx="35" cy="30" r="3.5" fill="#10b981" filter="url(#soft-glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="33" fill="#10b981" opacity="0.9">MODULE: GITHUB_ANALYTICS</text>
    <text x="685" y="33" fill="#f59e0b" opacity="0.8">STATUS: ACTIVE</text>
  </g>

  <!-- Title -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" text-anchor="middle">
    <text x="400" y="55" font-size="20" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#glow-stats)">
      ⚡ GITHUB PERFORMANCE STATS
    </text>
    <text x="400" y="55" font-size="20" font-weight="900" letter-spacing="4" fill="#10b981">
      ⚡ GITHUB PERFORMANCE STATS
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="72" x2="750" y2="72" stroke="url(#edge-grad-stats)" stroke-width="1" opacity="0.3"/>

  <!-- Left Column: Core Metrics -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" transform="translate(60, 95)">
    <text x="0" y="20" fill="#f59e0b" font-size="11" letter-spacing="1">&gt; CORE_METRICS:</text>
    
    <g transform="translate(15, 42)" font-size="12">
      <text x="0" y="0" fill="#9ca3af">Total Stars Earned:</text>
      <text x="230" y="0" fill="#10b981" font-weight="bold">35</text>

      <text x="0" y="28" fill="#9ca3af">Total Commits (Last Year):</text>
      <text x="230" y="28" fill="#10b981" font-weight="bold">293</text>

      <text x="0" y="56" fill="#9ca3af">Total Pull Requests:</text>
      <text x="230" y="56" fill="#10b981" font-weight="bold">13</text>

      <text x="0" y="84" fill="#9ca3af">Total Issues:</text>
      <text x="230" y="84" fill="#10b981" font-weight="bold">1</text>

      <text x="0" y="112" fill="#9ca3af">Contributed To (Last Year):</text>
      <text x="230" y="112" fill="#10b981" font-weight="bold">1</text>
    </g>
  </g>

  <!-- Right Column: Language Allocation HUD -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" transform="translate(420, 95)">
    <text x="0" y="20" fill="#f59e0b" font-size="11" letter-spacing="1">&gt; LANGUAGE_ALLOCATION:</text>
    
    <!-- Multi-segment Progress Bar -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="320" height="12" rx="3" fill="#111827" stroke="#374151" stroke-width="1"/>
      <!-- JavaScript 49.64% (~158px) -->
      <rect x="1" y="1" width="158" height="10" rx="2" fill="#f7df1e"/>
      <!-- HTML 17.52% (~56px) -->
      <rect x="159" y="1" width="56" height="10" fill="#e34f26"/>
      <!-- Blade 14.67% (~47px) -->
      <rect x="215" y="1" width="47" height="10" fill="#ff2d20"/>
      <!-- CSS 7.32% (~23px) -->
      <rect x="262" y="1" width="23" height="10" fill="#1572b6"/>
      <!-- PHP 6.29% (~20px) -->
      <rect x="285" y="1" width="20" height="10" fill="#777bb4"/>
      <!-- SCSS 4.56% (~14px) -->
      <rect x="305" y="1" width="14" height="10" rx="2" fill="#cc6699"/>
    </g>

    <!-- Language Legend Grid -->
    <g transform="translate(0, 75)" font-size="10">
      <circle cx="5" cy="5" r="3.5" fill="#f7df1e"/><text x="15" y="8" fill="#d1d5db">JavaScript</text><text x="135" y="8" fill="#10b981" font-weight="bold">49.6%</text>
      
      <circle cx="5" cy="28" r="3.5" fill="#e34f26"/><text x="15" y="31" fill="#d1d5db">HTML</text><text x="135" y="31" fill="#10b981" font-weight="bold">17.5%</text>
      
      <circle cx="5" cy="51" r="3.5" fill="#ff2d20"/><text x="15" y="54" fill="#d1d5db">Blade</text><text x="135" y="54" fill="#10b981" font-weight="bold">14.7%</text>

      <circle cx="165" cy="5" r="3.5" fill="#1572b6"/><text x="175" y="8" fill="#d1d5db">CSS</text><text x="290" y="8" fill="#10b981" font-weight="bold">7.3%</text>

      <circle cx="165" cy="28" r="3.5" fill="#777bb4"/><text x="175" y="31" fill="#d1d5db">PHP</text><text x="290" y="31" fill="#10b981" font-weight="bold">6.3%</text>

      <circle cx="165" cy="51" r="3.5" fill="#cc6699"/><text x="175" y="54" fill="#d1d5db">SCSS</text><text x="290" y="54" fill="#10b981" font-weight="bold">4.6%</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <line x1="50" y1="295" x2="750" y2="295" stroke="#374151" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="750" y="320" text-anchor="end" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#6b7280" letter-spacing="1">
    METRICS_SYNC: SECURE // NO API ERROR
  </text>
</svg>
