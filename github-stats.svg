<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-label="SKILL MATRIX STATS">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-stats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Neon Edge Gradient -->
    <linearGradient id="edge-grad-stats" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>  
      <stop offset="50%" stop-color="#f59e0b"/> 
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Background Grid -->
    <pattern id="grid-stats" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.06"/>
    </pattern>

    <!-- Neon Glow Filter for Scorpion Emblem -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="7.0" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow Filter for Title -->
    <filter id="glow-stats" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="340" rx="14" fill="url(#bg-grad-stats)"/>
  <rect width="800" height="340" rx="14" fill="url(#grid-stats)"/>

  <!-- Outer Border -->
  <rect x="2" y="2" width="796" height="336" rx="12" fill="none" stroke="url(#edge-grad-stats)" stroke-width="1.5" opacity="0.75"/>

  <!-- Cyber Corner Brackets -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="square" opacity="0.9">
    <path d="M 12 28 V 12 H 28"/>
    <path d="M 772 28 V 12 H 788"/>
    <path d="M 12 312 V 328 H 28"/>
    <path d="M 772 312 V 328 H 788"/>
  </g>

  <!-- Status Bar Top -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="10" letter-spacing="2">
    <circle cx="35" cy="30" r="3.5" fill="#10b981" filter="url(#soft-glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="33" fill="#10b981" opacity="0.9">MODULE: SKILL_MATRIX</text>
    <text x="575" y="33" fill="#f59e0b" opacity="0.8">STATUS: ACTIVE</text>
  </g>

  <!-- Exact Cyber Scorpion Emblem on Top Right -->
  <g transform="translate(715, 38) scale(0.65)" filter="url(#neon-glow)">
    <path d="M -15,10 C -25,0 -20,-20 0,-25 C 18,-25 25,-12 20,5 C 18,12 10,15 0,15 C -8,15 -12,8 -8,2 C -5,-3 0,-4 4,-2" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="4,-2 10,-8 1,-5" fill="#f59e0b"/>
    <path d="M -22,12 L -35,2 L -28,-8 M -35,2 L -42,-4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 22,12 L 35,2 L 28,-8 M 35,2 L 42,-4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" text-anchor="middle">
    <text x="400" y="55" font-size="20" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#glow-stats)">
      ⚡ CORE SKILL MATRIX
    </text>
    <text x="400" y="55" font-size="20" font-weight="900" letter-spacing="4" fill="#10b981">
      ⚡ CORE SKILL MATRIX
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="72" x2="750" y2="72" stroke="url(#edge-grad-stats)" stroke-width="1" opacity="0.3"/>

  <!-- Left Column: Core Capabilities -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" transform="translate(60, 95)">
    <text x="0" y="20" fill="#f59e0b" font-size="11" letter-spacing="1">&gt; CORE_CAPABILITIES:</text>
    
    <!-- Using block characters for a terminal/hacker style progress bar -->
    <g transform="translate(15, 42)" font-size="12">
      <text x="0" y="0" fill="#9ca3af">Frontend_Dev:</text>
      <text x="145" y="0" fill="#10b981" font-weight="bold">[█████████░]</text>

      <text x="0" y="28" fill="#9ca3af">Backend_API:</text>
      <text x="145" y="28" fill="#10b981" font-weight="bold">[█████████░]</text>

      <text x="0" y="56" fill="#9ca3af">Data_Analysis:</text>
      <text x="145" y="56" fill="#10b981" font-weight="bold">[█████████░]</text>

      <text x="0" y="84" fill="#9ca3af">System_Design:</text>
      <text x="145" y="84" fill="#10b981" font-weight="bold">[█████████░]</text>
    </g>
  </g>

  <!-- Right Column: Domain Allocation HUD -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" transform="translate(420, 95)">
    <text x="0" y="20" fill="#f59e0b" font-size="11" letter-spacing="1">&gt; DOMAIN_ALLOCATION:</text>
    
    <!-- Multi-segment Progress Bar (Total width 320px) -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="320" height="12" rx="3" fill="#111827" stroke="#374151" stroke-width="1"/>
      <!-- Web Dev 50% (160px) -->
      <rect x="1" y="1" width="159" height="10" rx="2" fill="#10b981"/>
      <!-- Mobile Dev 20% (64px) -->
      <rect x="160" y="1" width="64" height="10" fill="#f59e0b"/>
      <!-- Data Analytics 30% (96px) -->
      <rect x="224" y="1" width="95" height="10" rx="2" fill="#3b82f6"/>
    </g>

    <!-- Domain Legend Grid -->
    <g transform="translate(0, 75)" font-size="11">
      <!-- Web Dev -->
      <circle cx="5" cy="5" r="4" fill="#10b981"/>
      <text x="18" y="9" fill="#d1d5db">Web Development</text>
      <text x="285" y="9" fill="#10b981" font-weight="bold">50%</text>
      
      <!-- Mobile Dev -->
      <circle cx="5" cy="32" r="4" fill="#f59e0b"/>
      <text x="18" y="36" fill="#d1d5db">Mobile Development</text>
      <text x="285" y="36" fill="#10b981" font-weight="bold">20%</text>
      
      <!-- Data Analytics -->
      <circle cx="5" cy="59" r="4" fill="#3b82f6"/>
      <text x="18" y="63" fill="#d1d5db">Data Analytics</text>
      <text x="285" y="63" fill="#10b981" font-weight="bold">30%</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <line x1="50" y1="295" x2="750" y2="295" stroke="#374151" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="750" y="320" text-anchor="end" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#6b7280" letter-spacing="1">
    METRICS_SYNC: OFFLINE // STATIC_MODE_ACTIVE
  </text>
</svg>
