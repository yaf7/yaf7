<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="DEYAFA ARSETYA PROFILE HEADER">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Neon Edge Gradient -->
    <linearGradient id="edge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>  
      <stop offset="50%" stop-color="#f59e0b"/> 
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Sweep Light -->
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter for Scorpion Emblem -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="7.0" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow Filter for Title -->
    <filter id="glow-title" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.07"/>
    </pattern>

    <clipPath id="card-clip">
      <rect x="2" y="2" width="796" height="296" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="300" rx="14" fill="url(#bg-grad)"/>
  <rect width="800" height="300" rx="14" fill="url(#grid)"/>

  <!-- Scanning Light Sweep (Animated) -->
  <g clip-path="url(#card-clip)">
    <rect x="-800" y="0" width="800" height="300" fill="url(#sweep)">
      <animate attributeName="x" from="-800" to="800" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Outer Neon Border & Animation -->
  <g filter="url(#neon-glow)">
    <rect x="2" y="2" width="796" height="296" rx="12" fill="none" stroke="url(#edge-grad)" stroke-width="1.8" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Cyber Corner Brackets -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="square" opacity="0.95">
    <path d="M 12 28 V 12 H 28"/>
    <path d="M 772 28 V 12 H 788"/>
    <path d="M 12 272 V 288 H 28"/>
    <path d="M 772 272 V 288 H 788"/>
  </g>

  <!-- Status Bar Top -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="10" letter-spacing="2">
    <circle cx="35" cy="35" r="3.5" fill="#10b981" filter="url(#soft-glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="38" fill="#10b981" opacity="0.9">SYSTEM: ONLINE</text>
    <text x="680" y="38" fill="#f59e0b" opacity="0.8">LOC: KEDIRI_ID</text>
  </g>

  <!-- Cyber Scorpion Emblem (Center Icon Graphic) -->
  <g transform="translate(400, 110)" filter="url(#neon-glow)">
    <path d="M -15,10 C -25,0 -20,-20 0,-25 C 18,-25 25,-12 20,5 C 18,12 10,15 0,15 C -8,15 -12,8 -8,2 C -5,-3 0,-4 4,-2" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="4,-2 10,-8 1,-5" fill="#f59e0b"/>
    <path d="M -22,12 L -35,2 L -28,-8 M -35,2 L -42,-4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 22,12 L 35,2 L 28,-8 M 35,2 L 42,-4" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title & Subtitle Section (Matched with Tech Stack Style) -->
  <g text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', monospace">
    <!-- Main Name (White Glow Layer) -->
    <text x="400" y="185" font-size="38" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#glow-title)">
      DEYAFA ARSETYA
    </text>
    <!-- Main Name (Neon Green Layer) -->
    <text x="400" y="185" font-size="38" font-weight="900" letter-spacing="4" fill="#10b981">
      DEYAFA ARSETYA
    </text>

    <!-- Subtitle -->
    <text x="400" y="225" font-size="14" font-weight="600" letter-spacing="2" fill="#f59e0b">
      WEB &amp; MOBILE DEVELOPER | SYSTEM ANALYST | DATA ANALYST
    </text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="100" y1="255" x2="700" y2="255" stroke="url(#edge-grad)" stroke-width="1" opacity="0.4"/>

  <!-- Static Accent Scorpions di Kiri & Kanan Garis Bawah -->
  <g filter="url(#neon-glow)" opacity="0.85" transform="translate(130, 255) scale(0.5)">
    <path d="M -15,10 C -25,0 -20,-20 0,-25 C 18,-25 25,-12 20,5 C 18,12 10,15 0,15 C -8,15 -12,8 -8,2 C -5,-3 0,-4 4,-2" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <polygon points="4,-2 10,-8 1,-5" fill="#f59e0b"/>
  </g>
  <g filter="url(#neon-glow)" opacity="0.85" transform="translate(670, 255) scale(0.5) scale(-1, 1)">
    <path d="M -15,10 C -25,0 -20,-20 0,-25 C 18,-25 25,-12 20,5 C 18,12 10,15 0,15 C -8,15 -12,8 -8,2 C -5,-3 0,-4 4,-2" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <polygon points="4,-2 10,-8 1,-5" fill="#f59e0b"/>
  </g>
</svg>
