<svg xmlns="http://www.w3.org/2000/svg" width="800" height="425" viewBox="0 0 800 425" role="img" aria-label="TECH STACK">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-ts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090c"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Neon Edge Gradient -->
    <linearGradient id="edge-grad-ts" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>  
      <stop offset="50%" stop-color="#f59e0b"/> 
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-green-ts" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Background Grid -->
    <pattern id="grid-ts" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.06"/>
    </pattern>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="425" rx="14" fill="url(#bg-grad-ts)"/>
  <rect width="800" height="425" rx="14" fill="url(#grid-ts)"/>

  <!-- Outer Border -->
  <rect x="2" y="2" width="796" height="421" rx="12" fill="none" stroke="url(#edge-grad-ts)" stroke-width="1.5" opacity="0.75"/>

  <!-- Cyber Corner Brackets -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="square" opacity="0.9">
    <path d="M 12 28 V 12 H 28"/>
    <path d="M 772 28 V 12 H 788"/>
    <path d="M 12 397 V 413 H 28"/>
    <path d="M 772 397 V 413 H 788"/>
  </g>

  <!-- Status Bar Top -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="10" letter-spacing="2">
    <circle cx="35" cy="30" r="3.5" fill="#10b981" filter="url(#soft-glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="33" fill="#10b981" opacity="0.9">MODULE: TECH_STACK</text>
    <text x="685" y="33" fill="#f59e0b" opacity="0.8">SEC: 01</text>
  </g>

  <!-- Title -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" text-anchor="middle">
    <text x="400" y="55" font-size="22" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#glow-green-ts)">
      ⚡ SYSTEM TECH STACK
    </text>
    <text x="400" y="55" font-size="22" font-weight="900" letter-spacing="4" fill="#10b981">
      ⚡ SYSTEM TECH STACK
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="72" x2="750" y2="72" stroke="url(#edge-grad-ts)" stroke-width="1" opacity="0.3"/>

  <!-- Badges Container with Category Labels -->
  <g font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" font-weight="700">
    
    <!-- CATEGORY 1: LANGUAGES -->
    <g transform="translate(45, 95)">
      <text x="0" y="20" fill="#f59e0b" font-size="10" letter-spacing="1">&gt; LANGUAGES:</text>
      <g transform="translate(130, 0)">
        <g transform="translate(0, 0)">
          <rect width="80" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="40" y="18" text-anchor="middle" fill="#e34f26">HTML5</text>
        </g>
        <g transform="translate(88, 0)">
          <rect width="70" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="35" y="18" text-anchor="middle" fill="#1572b6">CSS3</text>
        </g>
        <g transform="translate(166, 0)">
          <rect width="105" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="52.5" y="18" text-anchor="middle" fill="#f7df1e">JavaScript</text>
        </g>
        <g transform="translate(279, 0)">
          <rect width="60" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="30" y="18" text-anchor="middle" fill="#777bb4">PHP</text>
        </g>
        <g transform="translate(347, 0)">
          <rect width="75" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="37.5" y="18" text-anchor="middle" fill="#7f52ff">Kotlin</text>
        </g>
        <g transform="translate(430, 0)">
          <rect width="80" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="40" y="18" text-anchor="middle" fill="#3776ab">Python</text>
        </g>
      </g>
    </g>

    <!-- CATEGORY 2: FRAMEWORKS -->
    <g transform="translate(45, 170)">
      <text x="0" y="20" fill="#f59e0b" font-size="10" letter-spacing="1">&gt; FRAMEWORKS:</text>
      <g transform="translate(130, 0)">
        <g transform="translate(0, 0)">
          <rect width="85" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="42.5" y="18" text-anchor="middle" fill="#ff2d20">Laravel</text>
        </g>
        <g transform="translate(93, 0)">
          <rect width="75" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="37.5" y="18" text-anchor="middle" fill="#61dafb">React</text>
        </g>
        <g transform="translate(176, 0)">
          <rect width="85" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="42.5" y="18" text-anchor="middle" fill="#ffffff">Next.js</text>
        </g>
        <g transform="translate(269, 0)">
          <rect width="95" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="47.5" y="18" text-anchor="middle" fill="#7952b3">Bootstrap</text>
        </g>
      </g>
    </g>

    <!-- CATEGORY 3: DATABASES -->
    <g transform="translate(45, 245)">
      <text x="0" y="20" fill="#f59e0b" font-size="10" letter-spacing="1">&gt; DATABASES:</text>
      <g transform="translate(130, 0)">
        <g transform="translate(0, 0)">
          <rect width="80" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="40" y="18" text-anchor="middle" fill="#00758f">MySQL</text>
        </g>
        <g transform="translate(88, 0)">
          <rect width="90" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="45" y="18" text-anchor="middle" fill="#ffca28">Firebase</text>
        </g>
        <g transform="translate(186, 0)">
          <rect width="95" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="47.5" y="18" text-anchor="middle" fill="#3ecf8e">Supabase</text>
        </g>
      </g>
    </g>

    <!-- CATEGORY 4: TOOLS -->
    <g transform="translate(45, 320)">
      <text x="0" y="20" fill="#f59e0b" font-size="10" letter-spacing="1">&gt; TOOLS:</text>
      <g transform="translate(130, 0)">
        <g transform="translate(0, 0)">
          <rect width="70" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="35" y="18" text-anchor="middle" fill="#646cff">Vite</text>
        </g>
        <g transform="translate(78, 0)">
          <rect width="65" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="32.5" y="18" text-anchor="middle" fill="#cb3837">npm</text>
        </g>
        <g transform="translate(151, 0)">
          <rect width="65" height="28" rx="5" fill="#111827" stroke="#374151" stroke-width="1"/>
          <text x="32.5" y="18" text-anchor="middle" fill="#f05033">Git</text>
        </g>
      </g>
    </g>

  </g>

  <!-- Footer Tag -->
  <line x1="50" y1="380" x2="750" y2="380" stroke="#374151" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="750" y="405" text-anchor="end" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="9" fill="#6b7280" letter-spacing="1">
    STATUS: ALL SYSTEMS OPERATIONAL // V2.0
  </text>
</svg>
